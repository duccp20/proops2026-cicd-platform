name: "Build App"
description: "Set up Node.js, install deps, generate prisma client, run tests"

inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "24"
  working-directory:
    description: "Where to run the build"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Generate Prisma client
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx prisma generate

    - name: Lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run lint

    - name: Test (build runs inside test script)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm test
