name: "Docker Build and Push"
description: "Build a docker image and optionally push to Docker Hub"

inputs:
  image-name:
    description: "Full image name, e.g. tert62/dsc-api-gateway"
    required: true
  image-tag:
    description: "Image tag (use commit SHA, never 'latest')"
    required: true
  push:
    description: "Push to registry (true) or build only (false)"
    required: false
    default: "false"
  registry-username:
    description: "Docker Hub username"
    required: false
  registry-password:
    description: "Docker Hub token"
    required: false

runs:
  using: "composite"
  steps:
    - uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      if: inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ inputs.push }}
        tags: ${{ inputs.image-name }}:${{ inputs.image-tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max