name: Reusable Deploy

on:
  workflow_call:
    inputs:
      image-name:
        type: string
        required: true
      image-tag:
        type: string
        required: true
      environment:
        description: "dev | staging | prod"
        type: string
        required: true
      service-name:
        type: string
        required: true
    secrets:
      DB_PASSWORD:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SERVICE_NAME: ${{ inputs.service-name }}
      ENVIRONMENT: ${{ inputs.environment }}
      IMAGE_NAME: ${{ inputs.image-name }}
      IMAGE_TAG: ${{ inputs.image-tag }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Create namespace
        run: kubectl create namespace "$ENVIRONMENT" --dry-run=client -o yaml | kubectl apply -f -

      - name: Debug vars
        run: |
          printf 'SERVICE_NAME=[%s]\n' "$SERVICE_NAME" | cat -A
          printf 'ENVIRONMENT=[%s]\n' "$ENVIRONMENT" | cat -A
          printf 'IMAGE_NAME=[%s]\n' "$IMAGE_NAME" | cat -A
          printf 'IMAGE_TAG=[%s]\n' "$IMAGE_TAG" | cat -A
          printf 'IMAGE_TAG length=%s\n' "${#IMAGE_TAG}"

      - name: Deploy
        run: |
          cat <<EOF > manifest.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${SERVICE_NAME}
            namespace: ${ENVIRONMENT}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: ${SERVICE_NAME}
            template:
              metadata:
                labels:
                  app: ${SERVICE_NAME}
              spec:
                containers:
                  - name: ${SERVICE_NAME}
                    image: ${IMAGE_NAME}:${IMAGE_TAG}
                    ports:
                      - containerPort: 3000
                    resources:
                      requests:
                        cpu: 50m
                        memory: 32Mi
                      limits:
                        cpu: 100m
                        memory: 64Mi
                    env:
                      - name: DB_PASSWORD
                        value: "${DB_PASSWORD}"
                    readinessProbe:
                      httpGet:
                        path: /health
                        port: 3000
                      initialDelaySeconds: 3
                      periodSeconds: 5
                    livenessProbe:
                      httpGet:
                        path: /health
                        port: 3000
                      initialDelaySeconds: 5
                      periodSeconds: 10
          EOF
          sed -n '18p' manifest.yaml | cat -A
          kubectl apply -f manifest.yaml

      - name: Wait for rollout
        run: kubectl -n "$ENVIRONMENT" rollout status deployment/"$SERVICE_NAME" --timeout=120s

      - name: Verify
        run: kubectl -n "$ENVIRONMENT" describe pod -l app="$SERVICE_NAME" | grep -E "Image:|Status:"
