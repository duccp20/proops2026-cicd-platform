name: Reusable Build

on:
  workflow_call:
    inputs:
      service-name:
        type: string
        required: true
      image-name:
        type: string
        required: true
      node-version:
        type: string
        default: "24"
      working-directory:
        type: string
        default: "."
    outputs:
      image-tag:
        description: "Commit SHA used as the image tag"
        value: ${{ jobs.build.outputs.image-tag }}
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        uses: duccp20/proops2026-cicd-platform/.github/actions/build-app@v2
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}

      - id: set-tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Docker build + push
        uses: duccp20/proops2026-cicd-platform/.github/actions/docker-build-push@v2
        with:
          context: ${{ inputs.working-directory }}
          image-name: ${{ inputs.image-name }}
          image-tag: ${{ steps.set-tag.outputs.tag }}
          push: "true"
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run summary
        run: |
          {
            echo "### Build complete"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`${{ inputs.image-name }}:${{ steps.set-tag.outputs.tag }}\` |"
            echo "| SHA | \`${{ steps.set-tag.outputs.tag }}\` |"
            echo ""
            echo "Copy the SHA above to promote this build via \`deploy-staging.yml\` / \`deploy-prod.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"
