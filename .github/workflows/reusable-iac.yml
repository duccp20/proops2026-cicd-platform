name: Reusable IaC

on:
  workflow_call:
    inputs:
      action:
        description: "plan | apply | destroy"
        type: string
        required: true
      environment:
        description: "dev | test | prod"
        type: string
        default: "dev"
      working-directory:
        description: "Terraform root config directory"
        type: string
        default: "iac/dev"
      aws-region:
        type: string
        default: "us-east-1"
      prefix:
        type: string
        default: "proops"
      project:
        type: string
        default: "training"
      region-code:
        type: string
        default: "use1"
      purpose:
        type: string
        default: "learn"
      responsible-party:
        type: string
        default: "duc_cp"
      owner:
        type: string
        default: "duc_cp"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  iac:
    runs-on: ubuntu-latest
    env:
      TF_VAR_prefix: ${{ inputs.prefix }}
      TF_VAR_project: ${{ inputs.project }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_region: ${{ inputs.aws-region }}
      TF_VAR_region_code: ${{ inputs.region-code }}
      TF_VAR_purpose: ${{ inputs.purpose }}
      TF_VAR_responsible_party: ${{ inputs.responsible-party }}
      TF_VAR_owner: ${{ inputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws-region }}

      - name: Init
        working-directory: ${{ inputs.working-directory }}
        run: terraform init

      - name: Validate
        working-directory: ${{ inputs.working-directory }}
        run: terraform validate

      - name: Plan
        working-directory: ${{ inputs.working-directory }}
        run: terraform plan -no-color -out=tfplan

      - name: Apply
        if: inputs.action == 'apply'
        working-directory: ${{ inputs.working-directory }}
        run: terraform apply -auto-approve -no-color tfplan

      - name: Destroy
        if: inputs.action == 'destroy'
        working-directory: ${{ inputs.working-directory }}
        run: terraform destroy -auto-approve -no-color
